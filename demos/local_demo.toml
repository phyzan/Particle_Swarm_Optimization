# Same run as demos/local_demo.cpp, driven through the normal binary:
#   ./build/pso demos/local_demo.toml
# Mirrors local_classic_demo.cpp from the reference implementation, including
# the defaults that demo inherited by not setting them.

[domain]
lower = [-2.5, -2.5]
upper = [ 2.5,  2.5]
bound_policy = "none"

[convergence]
objfun_target = 0.0
objfun_tol    = 1e-8
swap_tol      = 1e-5
mpfr_prec     = 64        # Local_Classic_Init default, not 100
max_iter      = 15000

[dynamics]
pop_size      = 20
c1            = 2.0
c2            = 1.7
w_max         = 0.5
w_min         = 0.01      # pso_params default; the demo never set it
w_decay_frac  = 0.75      # floor(0.75 * max_it), hardcoded in the original
vclamp_frac   = 0.5       # (upper - lower)/2, hardcoded in the original
constriction  = false
velocity_init = "uniform01"   # the original draws velocity unscaled

[topology]
kind         = "lsh"      # Local_Classic passes LLSH = true
n_neighbours = 0          # auto -> pop_size/4 = 5, hardcoded in the original
radius_frac  = 0.8        # ep.lsh_radius
dedup_tol    = 1e-12      # 1e-4 * err_goal, hardcoded in the original

[lsh]
n_projections = 4         # ep.lsh_k
window        = 3.0       # ep.lsh_w
n_tables      = 5         # ep.lsh_L

[strategy]
kind = "single"

[repulsion]
enabled = false           # Local_Classic passes repulsion = false

[poincare]
energy           = 17.0
section          = -1.8019693
n_crossings      = 1
c1               = 5.0
c2               = 3.0
c3               = -0.3
integrator       = "RK45"
dt_init          = 1e-3
rtol             = 1e-12  # 1e-4 * pc.err_goal, hardcoded in the original
atol             = 0.0
section_ftol     = 0.0
energy_drift_tol = 1e-6
t_max            = 1000.0
metric           = "weighted"

[execution]
seed    = 42
threads = 8
